# DEPLOY-V1-001: see docs/v1/app-platform.md for deployment and acceptance checks.
name: grd-dashboard-be
region: nyc
vpc:
  id: d65699ce-4000-4c53-bb2c-ed7fe9e4fd49
domains:
  - domain: api.globalresourcesdirect.com
    type: PRIMARY
    minimum_tls_version: '1.2'
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
databases:
  - name: db
    engine: PG
    version: '18'
    production: true
    cluster_name: dbaas-db-4718274
    db_name: grddb
    db_user: grdadmin
envs:
  - key: NODE_ENV
    scope: RUN_TIME
    type: GENERAL
    value: production
  - key: LOG_LEVEL
    scope: RUN_TIME
    type: GENERAL
    value: info
  - key: QUOTE_COMPARISON_ENABLED
    scope: RUN_TIME
    type: GENERAL
    value: 'false'
  - key: DB_HOST
    scope: RUN_TIME
    type: GENERAL
    value: ${db.HOSTNAME}
  - key: DB_PORT
    scope: RUN_TIME
    type: GENERAL
    value: ${db.PORT}
  - key: DB_NAME
    scope: RUN_TIME
    type: GENERAL
    value: grddb
  - key: DB_USER
    scope: RUN_TIME
    type: GENERAL
    value: grdadmin
  - key: DB_PASSWORD
    scope: RUN_TIME
    type: SECRET
    value: ${db.PASSWORD}
  - key: DB_CA_CERT
    scope: RUN_TIME
    type: SECRET
    value: ${db.CA_CERT}
  - key: DB_SSL_MODE
    scope: RUN_TIME
    type: GENERAL
    value: verify-full
  - key: DB_SSL_CA_FILE
    scope: RUN_TIME
    type: GENERAL
    value: /tmp/grd-db-ca.pem
services:
  - name: api
    image:
      registry_type: GHCR
      registry: jeffrey125
      repository: grd-dashboard-be
      digest: ${RELEASE_DIGEST}
      registry_credentials: ${GHCR_CREDENTIALS}
    run_command: sh -ec 'umask 077; printenv DB_CA_CERT > /tmp/grd-db-ca.pem; grep -q "[^[:space:]]" /tmp/grd-db-ca.pem; exec node dist/main.js'
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    termination:
      grace_period_seconds: 60
    http_port: 3000
    health_check:
      http_path: /api/v1/health/ready
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 5
    envs:
      - key: PORT
        scope: RUN_TIME
        type: GENERAL
        value: '3000'
      - key: AUTH_BASE_URL
        scope: RUN_TIME
        type: GENERAL
        value: https://api.globalresourcesdirect.com
      - key: AUTH_TRUSTED_ORIGINS
        scope: RUN_TIME
        type: GENERAL
        value: https://app.globalresourcesdirect.com
      - key: AUTH_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${AUTH_SECRET}
      - key: AUTH_TRUST_PROXY
        scope: RUN_TIME
        type: GENERAL
        value: digitalocean
workers:
  - name: worker
    image:
      registry_type: GHCR
      registry: jeffrey125
      repository: grd-dashboard-be
      digest: ${RELEASE_DIGEST}
      registry_credentials: ${GHCR_CREDENTIALS}
    run_command: sh -ec 'umask 077; printenv DB_CA_CERT > /tmp/grd-db-ca.pem; grep -q "[^[:space:]]" /tmp/grd-db-ca.pem; exec node dist/worker.js'
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-2gb
    termination:
      grace_period_seconds: 60
    envs:
      - key: UPS_ENVIRONMENT
        scope: RUN_TIME
        type: GENERAL
        value: production
      - key: UPS_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: ${UPS_CLIENT_ID}
      - key: UPS_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${UPS_CLIENT_SECRET}
      - key: ECHOSHIP_URL
        scope: RUN_TIME
        type: SECRET
        value: ${ECHOSHIP_URL}
      - key: ECHOSHIP_USERNAME
        scope: RUN_TIME
        type: SECRET
        value: ${ECHOSHIP_USERNAME}
      - key: ECHOSHIP_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${ECHOSHIP_PASSWORD}
      - key: FFE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${FFE_URL}
      - key: FFE_USERNAME
        scope: RUN_TIME
        type: SECRET
        value: ${FFE_USERNAME}
      - key: FFE_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${FFE_PASSWORD}
jobs:
  - name: migrate
    image:
      registry_type: GHCR
      registry: jeffrey125
      repository: grd-dashboard-be
      digest: ${RELEASE_DIGEST}
      registry_credentials: ${GHCR_CREDENTIALS}
    run_command: sh -ec 'umask 077; printenv DB_CA_CERT > /tmp/grd-db-ca.pem; grep -q "[^[:space:]]" /tmp/grd-db-ca.pem; exec node node_modules/typeorm/cli.js migration:run -d dist/infrastructure/database/data-source.js'
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    termination:
      grace_period_seconds: 60
    kind: PRE_DEPLOY
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: api
        preserve_path_prefix: true
